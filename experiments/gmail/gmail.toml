# Gmail platform manifest.
#
# Generated by scaffold.py. Review and fill in any TODOs before
# running a real benchmark.

name         = "gmail"
display_name = "Gmail"

# Env var name that the subprocess scripts (reset / seed / verify) read to
# authenticate against the workspace.
downstream_token_env = "GMAIL_TOKEN"

[paths]
# All paths are resolved relative to this manifest's directory
# (experiments/gmail/).
prompts_file         = "prompts/benchmark_prompts.json"
reset_script         = "scripts/reset_workspace.py"
seed_script          = "scripts/seed_workspace.py"
verify_script        = "scripts/verify_workspace.py"
output_dir           = "runs"
# Per-stack state file. {stack} expands to each stack's `name`.
state_file_template  = "scripts/workspace_state_ids_{stack}.json"
# Per-stack pre-seed prerequisites file (operator-managed, gitignored).
# Drop this line if the platform has no prerequisites file.
prereq_file_template = "scripts/prerequisites_{stack}.local.json"

# stacks[0] is the baseline; stacks[1] is the variant under evaluation.
[[stacks]]
name               = "gmail"
display_name       = "Gmail MCP - Official"
config_dir_env     = "GMAIL_CONFIG_DIR"
config_dir_default = "~/.claude-gmail-official"
token_env          = "GMAIL_TOKEN"
mcp_server         = "gmail"

[[stacks]]
name               = "hintas"
display_name       = "Gmail MCP - Hintas"
config_dir_env     = "GMAIL_HINTAS_CONFIG_DIR"
config_dir_default = "~/.claude-gmail-hintas"
token_env          = "HINTAS_TOKEN"
mcp_server         = "hintas-gmail"

[analysis]
display_name       = "Analyzer Claude"
config_dir_env     = "ANALYSIS_CONFIG_DIR"
config_dir_default = "~/.claude-analyzer"
prompt_template    = "per_run/gmail_analysis_prompt.md"
model              = "claude-sonnet-4-6"
