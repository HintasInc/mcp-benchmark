# Slack platform manifest.
#
# To add a new platform (e.g. Discord), drop a sibling directory under
# platforms/ containing <name>.toml and the workspace scripts, then invoke
# `benchmark run --platform <name>` — no Python changes required.

name         = "slack"
display_name = "Slack"

# Env var name that the subprocess scripts (reset / seed / verify) read to
# authenticate against the workspace. The orchestrator injects each stack's
# token under this name per invocation.
downstream_token_env = "SLACK_TOKEN"

[paths]
# All paths are resolved relative to this manifest's directory
# (platforms/slack/).
prompts_file        = "prompts/benchmark_prompts.json"
reset_script        = "scripts/reset_workspace.py"
seed_script         = "scripts/seed_workspace.py"
verify_script       = "scripts/verify_workspace.py"
output_dir          = "runs"
# Per-stack state file. {stack} expands to each stack's `name` so the two
# Slack workspaces don't clobber each other's IDs. Aligns with the Notion
# manifest so the orchestrator drives state-file naming uniformly.
state_file_template = "scripts/workspace_state_{stack}.json"

# Exactly two stacks. stacks[0] is the baseline (official MCP), stacks[1] is
# the variant under evaluation. Report deltas are computed as baseline − variant.
[[stacks]]
name               = "slack"
display_name       = "Slack MCP"
config_dir_env     = "SLACK_CONFIG_DIR"
config_dir_default = "~/.claude-slack"
token_env          = "SLACK_TOKEN"
mcp_server         = "slack"

[[stacks]]
name               = "hintas"
display_name       = "Hintas MCP"
config_dir_env     = "SLACK_HINTAS_CONFIG_DIR"
config_dir_default = "~/.claude-hintas"
token_env          = "HINTAS_TOKEN"
mcp_server         = "hintas-slack"

[analysis]
display_name       = "Analyzer Claude"
config_dir_env     = "ANALYSIS_CONFIG_DIR"
config_dir_default = "~/.claude-analyzer"
prompt_template    = "per_run/analysis_prompt.md"
model              = "claude-sonnet-4-6"
