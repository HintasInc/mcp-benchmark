[project]
name = "benchmarking"
version = "0.1.0"
description = "Hintas MCP vs official platform MCP head-to-head benchmark (Slack, Notion, ...)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
    "tomli>=2.4.1",
]

[project.scripts]
benchmark = "benchmarking.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmarking"]
